<!DOCTYPE html>
<html>
<head>
    <title>Edit Book</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="login-container">

<h2>✏️ Edit Book</h2>

<form method="POST">

    <input type="text" name="title" value="{{ book[1] }}" required>

    <input type="text" name="author" value="{{ book[2] }}" required>

    <input type="text" name="category" value="{{ book[3] }}" required>

    <input type="text" name="available" value="{{ book[4] }}" required>

    <button type="submit" class="btn">Update Book</button>

</form>

</div>

</body>
</html>
