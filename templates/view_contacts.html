```html
<!DOCTYPE html>
<html>
<head>
    <title>Contact Messages</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="dashboard">

    <h1>📩 Contact Messages</h1>

    <table border="1" cellpadding="10" cellspacing="0" style="margin:auto; width:90%; background:white;">

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Message</th>
        </tr>

        {% for contact in contacts %}

        <tr>
            <td>{{ contact[0] }}</td>
            <td>{{ contact[1] }}</td>
            <td>{{ contact[2] }}</td>
            <td>{{ contact[3] }}</td>
        </tr>

        {% endfor %}

    </table>

    <br><br>

    <a href="/admin" class="btn">Back to Admin Dashboard</a>

</div>

</body>
</html>
```
